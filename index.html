<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huldervegen</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e9eef2; font-family: system-ui, sans-serif; }
    #panel {
      position: absolute; top: 12px; left: 12px; z-index: 2;
      background: rgba(255,255,255,.92); border-radius: 10px; padding: 10px 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.15); max-width: calc(100vw - 160px);
    }
    #panel h1 { font-size: 15px; margin: 0 0 8px; }
    #panel .rad { display: flex; flex-wrap: wrap; gap: 6px; }
    #panel button {
      font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 6px;
      border: 1px solid #b9b2a8; background: #fff; cursor: pointer;
    }
    #panel button.på { background: #4b3324; color: #fff; border-color: #4b3324; }
    #panel p { font-size: 11px; color: #666; margin: 8px 0 0; }
    .etikett {
      font-size: 12px; line-height: 1.2; text-align: center; color: #222;
      background: rgba(255,255,255,.85); padding: 2px 6px; border-radius: 4px;
      pointer-events: none; white-space: nowrap;
    }
    .etikett small { color: #666; }
    #videoknapp {
      position: absolute; top: 12px; right: 12px; z-index: 2;
      font: inherit; font-size: 14px; font-weight: 600; color: #fff; background: #4b3324;
      border: 0; border-radius: 10px; padding: 9px 14px; cursor: pointer;
      box-shadow: 0 2px 10px rgba(0,0,0,.2);
    }
    #videoknapp:hover { background: #3a271b; }
    #video {
      width: 100vw; height: 100vh; max-width: none; max-height: none;
      margin: 0; padding: 0; border: 0; background: transparent;
    }
    #video[open] { display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; }
    #video::backdrop { background: rgba(20,14,10,.78); }
    #video video { width: min(92vw, 150vh); max-height: 80vh; border-radius: 12px; background: #000; }
    #videovalg { display: flex; gap: 6px; background: rgba(255,255,255,.12); padding: 4px; border-radius: 10px; }
    #videovalg button {
      font: inherit; font-size: 14px; font-weight: 600; color: #fff; background: transparent;
      border: 0; border-radius: 7px; padding: 7px 14px; cursor: pointer;
    }
    #videovalg button[aria-pressed="true"] { background: #fff; color: #2a1d14; }
    #lukkVideo {
      position: fixed; top: 12px; right: 12px; font: inherit; font-size: 22px; line-height: 1;
      width: 40px; height: 40px; border-radius: 50%; border: 0; background: #fff; cursor: pointer;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="panel">
    <h1>Huldervegen</h1>
    <div class="rad">
      <button id="etg1">1. etasje</button>
      <button id="etg2">2. etasje</button>
      <button id="etg3" class="på">3. etasje</button>
    </div>
    <div class="rad" style="margin-top:6px">
      <button id="vis3d" class="på">3D</button>
      <button id="ovenfra">Ovenfra</button>
      <button id="lave">Lave vegger</button>
      <button id="tak">Tak</button>
      <button id="etiketter" class="på">Etiketter</button>
    </div>
    <p>Dra for å rotere, høyreklikk/to fingre for å flytte, scroll for zoom.<br>
       Mål fra planskisse (ca.), ikke oppmålt.</p>
  </div>

  <button id="videoknapp" aria-haspopup="dialog">▶ Se video</button>
  <dialog id="video" aria-label="Video: gjennomgang av huset">
    <button id="lukkVideo" aria-label="Lukk" autofocus>×</button>
    <div id="videovalg">
      <button data-film="omvisning" aria-pressed="true">Omvisning · 1:31</button>
      <button data-film="huldervegen" aria-pressed="false">Kort video · 0:22</button>
    </div>
    <video id="filmen" controls playsinline preload="none"></video>
  </dialog>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // Koordinater i meter. Origo = hagesidens ytre hjørne til venstre på planskissen.
    // x: bredde (0 → 5,27), z: dybde fra hage (0) mot inngang (9,85), y: opp. Gulv inne = 0.
    const B = 5.27;        // husets bredde
    const D = 9.85;        // husets dybde
    const T = 0.2;         // yttervegg
    const H = 2.5;         // takhøyde
    const F = H + 0.2;     // etasjehøyde, gulv til gulv
    const UTE = -0.35;     // terreng på inngangssiden

    // ---------- Renderer, scene, kamera ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.localClippingEnabled = true;
    document.body.appendChild(renderer.domElement);

    const etikettRenderer = new CSS2DRenderer();
    etikettRenderer.setSize(window.innerWidth, window.innerHeight);
    // egen stablingskontekst, ellers legger etikettenes z-index seg over panel og videolag
    Object.assign(etikettRenderer.domElement.style, { position: 'absolute', top: '0', pointerEvents: 'none', zIndex: '1' });
    document.body.appendChild(etikettRenderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe9eef2);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
    const midt = new THREE.Vector3(B / 2, 0, 4.9);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2 - 0.02;
    controls.minDistance = 2;
    controls.maxDistance = 60;

    // ---------- Lys ----------
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a6a, 1.6));
    const sol = new THREE.DirectionalLight(0xfff3e0, 2.2);
    sol.position.set(-8, 14, -6);
    sol.target.position.copy(midt);
    sol.castShadow = true;
    sol.shadow.mapSize.set(2048, 2048);
    Object.assign(sol.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 50 });
    sol.shadow.bias = -0.0005;
    scene.add(sol, sol.target);

    // ---------- Materialer ----------
    // Kutteplan for «lave vegger»: alt over konstanten klippes bort.
    const kutt = new THREE.Plane(new THREE.Vector3(0, -1, 0), 100);
    const mat = (color, opt = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, ...opt });
    const veggMat = (color, opt = {}) => mat(color, { clippingPlanes: [kutt], clipShadows: true, side: THREE.DoubleSide, ...opt });

    const M = {
      innervegg: veggMat(0xb8afa4),
      kledning:  veggMat(0x4b3324),
      ramme:     veggMat(0x5e4838),
      hvitRamme: veggMat(0xf1efeb),
      glass:     veggMat(0xa9cbe0, { transparent: true, opacity: 0.3, roughness: 0.05, depthWrite: false }),
      ytterdør:  veggMat(0x3f2a1f),
      hvitDør:   veggMat(0xf6f5f2),
      bodDør:    veggMat(0x7a4a36),
      speil:     veggMat(0xd5dde2, { metalness: 0.9, roughness: 0.08 }),
      eik:       mat(0xdcbf95),
      fliser:    mat(0x3a322d),
      grått:     mat(0xc9c4bc),
      terrasse:  mat(0x6a4630),
      spiler:    mat(0x6e4c33),
      asfalt:    mat(0x707070),
      gress:     mat(0x8a9a78),
      hvit:      mat(0xf3f2ef, { roughness: 0.5 }),
      benk:      mat(0xa8713c, { roughness: 0.6 }),
      flis:      mat(0xece5da),
      svart:     mat(0x1d1d1f, { roughness: 0.5 }),
      stål:      mat(0xbfc3c6, { metalness: 0.8, roughness: 0.3 }),
      sofa:      mat(0xcdc8c0),
      sengetøy:  mat(0xe6e0d8),
      finer:     veggMat(0xc99a5f, { roughness: 0.6 }),
      badFlis:   mat(0xddd6cb, { roughness: 0.4 }),
      flisBrun:  mat(0x8a7866),
      flisStripe: veggMat(0x8a7866),
      mørkGrå:   mat(0x4a4b4e),
      marine:    mat(0x3c3f55),
      betong:    mat(0xa9aba9),
      mørkFlis:  mat(0x3a3b3d),
      teppe:     mat(0xcfc8bb),
      bordplate: mat(0xb07a45, { roughness: 0.6 }),
      tvBenk:    mat(0xd6d0c8),
      kugle:     mat(0x8a8f94, { transparent: true, opacity: 0.75, roughness: 0.1, metalness: 0.3 }),
      flett:     mat(0x8f8676),
      tak:       veggMat(0xf4f3f0),
      skap:      veggMat(0xf3f2ef, { roughness: 0.5 }),
      porteTak:  mat(0xb9bcbd),
      // 1. etasje, etter bildene
      vegg1:     veggMat(0x968d82),
      mørkEik:   mat(0x4a3e36, { roughness: 0.7 }),
      stoff:     mat(0xd8d1c5),
      rotting:   mat(0x7d7b78),
      svartGlass: mat(0x202224, { roughness: 0.1, metalness: 0.3 }),
      gardin:    veggMat(0xf2f0ec, { transparent: true, opacity: 0.75 }),
      bronse:    mat(0x4b3d2c, { roughness: 0.5, metalness: 0.4 }),
      lampe:     mat(0xd9a462, { emissive: 0x6b4518 }),
      // 2. etasje, etter bildene
      vegg2:     veggMat(0xd6d0c7),
      grønnVegg: veggMat(0xa9b2a5),
      blåVegg:   veggMat(0xb3c1d0),
      badvegg:   veggMat(0xdcd9d3, { roughness: 0.4 }),
      gardinBrun: veggMat(0x8b7b6c),
      seng:      mat(0x55575b),
      // 3. etasje, etter bildene
      vegg3:     veggMat(0xcfc8bd),
      hvitFlis:  veggMat(0xeeeeeb, { roughness: 0.3 }),
      lysGrå:    mat(0xb7babd),
      mørkBrun:  mat(0x3b2e27, { roughness: 0.6 }),
      lysEik:    mat(0xd2ab74, { roughness: 0.6 }),
      ryeTeppe:  mat(0xc4bcb0),
    };

    // ---------- Hjelpere ----------
    let mål = scene;       // gruppa nye deler legges i (byttes til etg2 for 2. etasje)
    let standardVegg = M.vegg1;  // veggfarge for vegg() uten egen farge; 1. etasje er mørkere greige
    const veggbokser = []; // vegger og skap som kortes ned med «Lave vegger»

    // Boks fra min-/maks-hjørner (meter). Returnerer meshet.
    function boks(x1, y1, z1, x2, y2, z2, m, forelder = mål) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(x2 - x1, y2 - y1, z2 - z1), m);
      mesh.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
      mesh.castShadow = mesh.receiveShadow = true;
      if (m.clippingPlanes) veggbokser.push({ mesh, y1, y2 });
      forelder.add(mesh);
      return mesh;
    }

    // Vegg langs x (akse 'x', okkuperer z a..b) eller langs z (akse 'z', okkuperer x a..b).
    // Åpninger: { fra, til, nede, oppe, type: 'vindu' | 'dør' | 'glassdør' | 'åpning' | 'karm', farge,
    //             poster: [s, ...] loddrette poster, tverr: [y, ...] tverrposter over gulvet }
    function vegg(akse, a, b, fra, til, åpninger = [], m = standardVegg, y0 = 0, h = H) {
      const del = (s1, s2, y1, y2, mm = m) => akse === 'x'
        ? boks(s1, y1, a, s2, y2, b, mm)
        : boks(a, y1, s1, b, y2, s2, mm);
      const midt = (a + b) / 2;
      const tynn = (s1, s2, y1, y2, mm, tykk = 0.04) => akse === 'x'
        ? boks(s1, y1, midt - tykk / 2, s2, y2, midt + tykk / 2, mm)
        : boks(midt - tykk / 2, y1, s1, midt + tykk / 2, y2, s2, mm);

      let pos = fra;
      for (const o of [...åpninger].sort((p, q) => p.fra - q.fra)) {
        if (o.fra > pos) del(pos, o.fra, y0, y0 + h);
        if (o.nede > 0) del(o.fra, o.til, y0, y0 + o.nede);
        if (o.oppe < h) del(o.fra, o.til, y0 + o.oppe, y0 + h);
        const ramme = o.ramme ?? M.ramme, r = 0.05;
        const y1 = y0 + o.nede, y2 = y0 + o.oppe;
        if (o.type === 'vindu' || o.type === 'glassdør') {
          tynn(o.fra, o.til, y1, y2, M.glass, 0.02).castShadow = false;
          tynn(o.fra, o.fra + r, y1, y2, ramme, 0.08);
          tynn(o.til - r, o.til, y1, y2, ramme, 0.08);
          tynn(o.fra, o.til, y2 - r, y2, ramme, 0.08);
          tynn(o.fra, o.til, y1, y1 + r, ramme, 0.08);
          for (const s of o.poster ?? []) tynn(s - r / 2, s + r / 2, y1, y2, ramme, 0.08);
          for (const t of o.tverr ?? []) tynn(o.fra, o.til, y0 + t - r / 2, y0 + t + r / 2, ramme, 0.08);
        } else if (o.type === 'karm') {                             // hvit foring rundt åpningen
          const k = 0.03;
          del(o.fra, o.fra + k, y1, y2, M.hvitRamme);
          del(o.til - k, o.til, y1, y2, M.hvitRamme);
          del(o.fra, o.til, y2 - k, y2, M.hvitRamme);
          if (o.nede > 0) del(o.fra, o.til, y1, y1 + k, M.hvitRamme);
        } else if (o.type === 'dør') {
          tynn(o.fra, o.til, y1, y2, o.farge ?? M.ytterdør, 0.05);
        }
        pos = o.til;
      }
      if (til > pos) del(pos, til, y0, y0 + h);
    }

    // Prisme fra et polygon i grunnplanet ([x, z]-punkter), fra y1 til y2.
    function prisme(punkter, y1, y2, m, forelder = mål) {
      const form = new THREE.Shape(punkter.map(([x, z]) => new THREE.Vector2(x, -z)));
      const mesh = new THREE.Mesh(new THREE.ExtrudeGeometry(form, { depth: y2 - y1, bevelEnabled: false }), m);
      mesh.rotation.x = -Math.PI / 2;                  // formas y → -z, ekstrudering → +y
      mesh.position.y = y1;
      mesh.castShadow = mesh.receiveShadow = true;
      forelder.add(mesh);
      return mesh;
    }

    // Vindeltrinn: kakestykke fra hjørnet (px, pz) mellom vinklene a1 og a2 (radianer i xz-planet),
    // avgrenset av rektangelet r. Returnerer polygonet som [x, z]-punkter.
    function vifte(px, pz, r, a1, a2) {
      const treff = a => {
        const dx = Math.cos(a), dz = Math.sin(a);
        let t = Infinity;
        for (const X of [r.x1, r.x2]) if (Math.abs(dx) > 1e-9) {
          const s = (X - px) / dx, z = pz + s * dz;
          if (s > 1e-6 && z >= r.z1 - 1e-6 && z <= r.z2 + 1e-6) t = Math.min(t, s);
        }
        for (const Z of [r.z1, r.z2]) if (Math.abs(dz) > 1e-9) {
          const s = (Z - pz) / dz, x = px + s * dx;
          if (s > 1e-6 && x >= r.x1 - 1e-6 && x <= r.x2 + 1e-6) t = Math.min(t, s);
        }
        return [px + t * dx, pz + t * dz];
      };
      const hjørner = [[r.x1, r.z1], [r.x2, r.z1], [r.x2, r.z2], [r.x1, r.z2]]
        .map(([x, z]) => [Math.atan2(z - pz, x - px), x, z])
        .filter(([a]) => a > a1 + 1e-6 && a < a2 - 1e-6)
        .sort((p, q) => p[0] - q[0]);
      return [[px, pz], treff(a1), ...hjørner.map(([, x, z]) => [x, z]), treff(a2)];
    }

    // Liggende spiler (gjerde/kledning) langs x eller z.
    function spilevegg(akse, a, b, fra, til, y0, h, m = M.spiler) {
      for (let y = y0 + 0.02; y < y0 + h; y += 0.075) {
        const y2 = Math.min(y + 0.048, y0 + h);
        if (akse === 'x') boks(fra, y, a, til, y2, b, m); else boks(a, y, fra, b, y2, til, m);
      }
      const stolpe = 0.06;
      for (let s = fra; s < til; s += 1.2) {
        if (akse === 'x') boks(s, y0, a, Math.min(s + stolpe, til), y0 + h, b, m);
        else boks(a, y0, s, b, y0 + h, Math.min(s + stolpe, til), m);
      }
    }

    // Spilevegg med høyde som varierer langs veggen; profil = [[s, h], ...] stigende i s.
    function spileveggProfil(akse, a, b, profil, y0, m = M.spiler) {
      const høyde = s => {
        for (let i = 1; i < profil.length; i++) {
          const [s1, h1] = profil[i - 1], [s2, h2] = profil[i];
          if (s <= s2) return h1 + (h2 - h1) * (s - s1) / (s2 - s1);
        }
        return profil.at(-1)[1];
      };
      const del = (s1, s2, y1, y2) => akse === 'x' ? boks(s1, y1, a, s2, y2, b, m) : boks(a, y1, s1, b, y2, s2, m);
      const fra = profil[0][0], til = profil.at(-1)[0], steg = 0.02;
      const maks = Math.max(...profil.map(([, h]) => h));
      for (let y = 0.02; y + 0.048 <= maks; y += 0.075) {
        // finn strekket der veggen er høy nok for denne spila
        let start = null;
        for (let s = fra; s <= til + 1e-9; s += steg) {
          const inne = høyde(s) >= y + 0.048;
          if (inne && start === null) start = s;
          const sist = s + steg > til + 1e-9;
          if (start !== null && (!inne || sist)) { del(start, inne ? til : s, y0 + y, y0 + y + 0.048); start = null; }
        }
      }
      for (let s = fra; s < til - 0.06; s += 1.2) del(s, s + 0.06, y0, y0 + høyde(s));
      del(til - 0.06, til, y0, y0 + høyde(til));
    }

    // gruppe: 'etg1' / 'etg2' / 'etg3' vises med sin etasje, 'ute' vises alltid
    const etiketter = [];
    function etikett(tekst, areal, x, z, y = 1.3, gruppe = 'etg1') {
      const div = document.createElement('div');
      div.className = 'etikett';
      div.innerHTML = `${tekst}<br><small>${areal}</small>`;
      const obj = new CSS2DObject(div);
      obj.position.set(x, y, z);
      obj.userData.gruppe = gruppe;
      scene.add(obj);
      etiketter.push(obj);
    }

    // ---------- Terreng og gulv ----------
    boks(-12, UTE - 0.1, -12, 18, UTE, 22, M.gress).castShadow = false;
    boks(-0.6, UTE, D, 2.82, UTE + 0.01, 14.55, M.asfalt);           // gårdsplass foran
    boks(0, -0.2, 0, B, 0, D, M.grått);                               // betongdekke
    boks(T, 0, T, B - T, 0.01, D - T, M.eik);                         // eikeparkett
    boks(2.98, 0.01, 7.35, 4.42, 0.015, D - T, M.fliser);             // entré, mørke fliser
    boks(0, -0.2, -4.72, B, -0.05, 0, M.terrasse);                    // terrasse 25 m²
    for (let x = 0.05; x < B; x += 0.15) boks(x, -0.05, -4.72, x + 0.12, -0.03, 0, M.terrasse);

    // ---------- Yttervegger (indre lag greige, ytre lag kledning) ----------
    // Etter bildene: stort vindu (smalt sidehengslet felt mot venstre vegg), så glassdør med
    // fast sidefelt og overlys. Hvite karmer innvendig.
    const hageÅpninger = [
      { fra: 0.96, til: 2.77, nede: 0.45, oppe: 2.30, type: 'vindu', poster: [1.50] },
      { fra: 3.01, til: 4.20, nede: 0.00, oppe: 2.30, type: 'glassdør', poster: [3.85], tverr: [2.00] },
    ];
    vegg('x', 0, 0.1, 0, B, hageÅpninger, M.kledning);
    vegg('x', 0.1, T, T, B - T, hageÅpninger.map(o => ({ ...o, type: 'karm' })));

    const frontÅpninger = [
      { fra: 0.91, til: 2.18, nede: 0.95, oppe: 2.10, type: 'vindu', poster: [1.75] },
      { fra: 3.15, til: 3.90, nede: 0.00, oppe: 2.10, type: 'dør' },
    ];
    vegg('x', D - 0.1, D, 0, B, frontÅpninger, M.kledning);
    vegg('x', D - T, D - 0.1, T, B - T, frontÅpninger.map(o => ({ ...o, type: 'karm' })));
    // rundt vindu i ytterdøra
    const koøye = new THREE.Mesh(new THREE.CircleGeometry(0.13, 24), M.glass);
    koøye.position.set(3.525, 1.5, D - 0.02);
    scene.add(koøye);

    vegg('z', 0, 0.1, 0, D, [], M.kledning);
    vegg('z', 0.1, T, T, D - T);
    vegg('z', B - 0.1, B, 0, D, [], M.kledning);
    vegg('z', B - T, B - 0.1, T, D - T);

    // ---------- Innervegger ----------
    vegg('z', 2.88, 2.98, 7.25, D - T);                               // kjøkken | entré
    boks(2.28, 0, 6.80, 2.98, H, 7.25, standardVegg);                 // pilar med speil
    // organisk formet speil på pilaren mot stua

    // ---------- Trapp ----------
    // Samme trapp i hver etasje: tre vindeltrinn inn fra vest, rett løp langs høyre vegg mot

    const opptrinn = F / 14;

    // Trapp fra gulvet på y0 til y0 + F.
    function trapp(y0) {

    // Lukket side mellom trappa og rommet ved siden av; omriss som [z, y]-punkter over y0.

    // ---------- Stue og spisestue (etter bildene) ----------
    // Oval skive: sylinder skalert til ellipse, rx langs x og rz langs z.

    boks(B - T - 0.45, 0.05, 1.00, B - T, 0.48, 2.80, M.mørkEik);

    // ---------- Terrasse mot hagen (25 m²) ----------
    // sideveggene er høye inntil huset og skrår ned utover mot hagen
    const hageSide = [[-4.72, 1.0], [-3.2, 1.0], [-0.6, 2.0], [0, 2.0]];
    spileveggProfil('z', 0, 0.06, hageSide, -0.05);

    boks(2.75, UT + 0.60, -0.90, 3.28, UT + 0.92, -0.45, M.svart);
    boks(0.40, 2.40, -0.18, 4.40, 2.55, 0, M.mørkGrå);

    // ---------- Inngangsparti: terrasse 4 m², bod 5 m², gårdsplass ----------
    boks(3.06, UTE, D, B, -0.03, 11.66, M.terrasse);
    for (const [x1, y2] of [[2.64, UTE + 0.11], [2.85, UTE + 0.22]]) boks(x1, UTE, 10.2, 3.06, y2, 11.4, M.terrasse);
    spilevegg('z', B - 0.08, B, D, 11.66, -0.03, 1.0);               // lav vegg mot utsikten
    boks(4.55, -0.03, 10.40, B - 0.1, 0.42, 11.10, M.benk);          // benk

    vegg('z', 2.82, 2.90, 11.66, 14.55, [
      { fra: 13.00, til: 13.70, nede: 0, oppe: 2.1, type: 'dør', farge: M.bodDør },

    // ved inngangsdøra: spileskjerm på veggfeltet til venstre, beslag og rund vegglampe
    boks(2.18, 1.00, D, 3.15, 1.03, D + 0.05, M.porteTak);
    spilevegg('x', D, D + 0.04, 2.20, 3.12, 1.03, 1.47);
    const lampe = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.06, 32), M.svart);

    const tak = new THREE.Group();

    boks(-0.01, H, 0, 0.1, F, D, M.kledning);
    boks(B - 0.1, H, 0, B + 0.01, F, D, M.kledning);

    // yttervegger. Mot hagen etter bildene: bredt vindu med lav brystning i soverom 13,
    // vindu med lavt felt nederst i soverom 7.
    const hage2 = [
      { fra: 1.00, til: 2.70, nede: 0.45, oppe: 2.30, type: 'vindu', poster: [1.55], ramme: M.hvitRamme },
      { fra: 3.05, til: 4.40, nede: 0.55, oppe: 2.20, type: 'vindu', tverr: [0.95], ramme: M.hvitRamme },
    ];
    vegg('x', 0, 0.1, 0, B, hage2, M.kledning, F);
    vegg('x', 0.1, T, T, B - T, hage2.map(o => ({ ...o, type: 'karm' })), standardVegg, F);
    const front2 = [
      { fra: 0.99, til: 3.16, nede: 0.85, oppe: 2.20, type: 'vindu', poster: [1.75], ramme: M.hvitRamme },
      { fra: 3.37, til: 4.13, nede: 0.00, oppe: 2.20, type: 'glassdør', ramme: M.hvitRamme },
    ];
    vegg('x', D - 0.1, D, 0, B, front2, M.kledning, F);
    vegg('x', D - T, D - 0.1, T, B - T, front2.map(o => ({ ...o, type: 'karm' })), standardVegg, F);
    vegg('z', 0, 0.1, 0, D, [], M.kledning, F);
    vegg('z', 0.1, T, T, D - T, [], standardVegg, F);
    vegg('z', B - 0.1, B, 0, D, [], M.kledning, F);
    vegg('z', B - T, B - 0.1, T, D - T, [], standardVegg, F);

    // innervegger og sjakter, hvite karmer rundt dørene
    const dør = (fra, til) => ({ fra, til, nede: 0, oppe: 2.05, type: 'karm' });
    vegg('z', 2.85, 2.94, T, 7.18, [dør(3.63, 4.39), dør(5.42, 6.04)], standardVegg, F); // soverom 13 og bad | gang
    vegg('x', 4.55, 4.64, T, 2.85, [], standardVegg, F);                                 // soverom 13 | bad
    vegg('x', 3.20, 3.30, 2.94, B - T, [dør(3.08, 3.84)], standardVegg, F);              // soverom 7 | gang
    vegg('x', 7.18, 7.30, T, B - T, [dør(3.11, 3.84)], standardVegg, F);                 // gang | soverom 12
    boks(2.17, F, 6.75, 2.85, F + H, 7.18, M.badvegg);                                   // sjakt ved badet
    boks(3.96, F, 7.30, B - T, F + H, 7.83, standardVegg);                               // sjakt over tek. rom
    // dørblad, åpne
    boks(2.09, F, 4.35, 2.85, F + 2.03, 4.39, M.hvitDør);             // soverom 13, ligger inn mot garderoben
    boks(3.08, F, 2.44, 3.12, F + 2.03, 3.20, M.hvitDør);             // soverom 7
    boks(2.875, F, 5.45, 2.915, F + 2.03, 6.01, M.hvitDør);           // bad, lukket (slår ut i gangen)
    boks(3.80, F, 7.30, 3.84, F + 2.03, 8.03, M.hvitDør);             // soverom 12

    // Malte rom og flislagt bad: tynt lag på veggflatene inne i rommet, med hull for åpningene.
    const flate = (akse, a, b, fra, til, åpninger, m) =>
      vegg(akse, a, b, fra, til, åpninger.map(o => ({ ...o, type: 'åpning' })), m, F);
    const L = 0.004;
    // soverom 13: grågrønt
    flate('x', T, T + L, T, 2.85, [hage2[0]], M.grønnVegg);
    flate('z', T, T + L, T, 4.55, [], M.grønnVegg);
    flate('x', 4.55 - L, 4.55, T, 2.85, [], M.grønnVegg);
    flate('z', 2.85 - L, 2.85, T, 4.55, [dør(3.63, 4.39)], M.grønnVegg);
    // soverom 7: lyseblått
    flate('x', T, T + L, 2.94, B - T, [hage2[1]], M.blåVegg);
    flate('z', 2.94, 2.94 + L, T, 3.20, [], M.blåVegg);
    flate('z', B - T - L, B - T, T, 3.20, [], M.blåVegg);
    flate('x', 3.20 - L, 3.20, 2.94, B - T, [dør(3.08, 3.84)], M.blåVegg);
    // bad: lyse, store fliser på alle vegger
    flate('z', T, T + L, 4.64, 7.18, [], M.badvegg);
    flate('x', 4.64, 4.64 + L, T, 2.85, [], M.badvegg);
    flate('z', 2.85 - L, 2.85, 4.64, 7.18, [dør(5.42, 6.04)], M.badvegg);
    flate('x', 7.18 - L, 7.18, T, 2.17, [], M.badvegg);

    // trapp videre til 3. etasje, med hvitt rekkverk mellom gangen og trapperommet
    trapp(F);
    for (let z = nedreSving.z2 + 0.06; z < øvreSving.z1; z += 0.12) {
      boks(4.055, F, z - 0.015, 4.085, F + 0.95, z + 0.015, M.hvit);
    }
    boks(4.04, F + 0.95, nedreSving.z2, 4.10, F + 1.0, øvreSving.z1, M.hvit);
    boks(4.04, F, øvreSving.z1 - 0.03, 4.10, F + 1.0, øvreSving.z1 + 0.03, M.hvit);
    // kartbilder i gangen
    for (const [z1, z2, y1, y2] of [[4.70, 5.20, 1.25, 1.95], [6.30, 6.58, 1.40, 1.80]]) {
      boks(2.94, F + y1, z1, 2.965, F + y2, z2, M.bronse);
      boks(2.965, F + y1 + 0.03, z1 + 0.03, 2.97, F + y2 - 0.03, z2 - 0.03, M.hvit);
    }

    // Hjelper: seng med stoppet bunn, lys madrass og dyne
    function seng(x1, z1, x2, z2, bunn = M.seng) {
      boks(x1, F + 0.08, z1, x2, F + 0.40, z2, bunn);
      boks(x1 + 0.02, F + 0.40, z1 + 0.02, x2 - 0.02, F + 0.55, z2 - 0.02, M.sengetøy);
      for (const [x, z] of [[x1 + 0.05, z1 + 0.05], [x2 - 0.08, z1 + 0.05], [x1 + 0.05, z2 - 0.08], [x2 - 0.08, z2 - 0.08]])
        boks(x, F, z, x + 0.03, F + 0.08, z + 0.03, M.stål);
    }
    // Hjelper: hvitt garderobeskap med fyllingsdører langs x eller z (front mot +/-)
    function garderobe(x1, z1, x2, z2, høyde = 2.36) {
      boks(x1, F, z1, x2, F + høyde, z2, M.skap);
    }

    // soverom 13 m² (mot hagen): hvite garderobeskap med speildør og hjørneskap mot badet,
    // kommode og seng langs veggen, nattbord ved vinduet
    garderobe(0.75, 3.97, 2.05, 4.55);
    boks(1.19, F + 0.05, 3.965, 1.61, F + 2.30, 3.97, M.speil);
    garderobe(T, 3.40, 0.75, 4.55);
    boks(T, F, 2.62, 0.68, F + 0.98, 3.38, M.hvit);                   // kommode
    seng(T + 0.02, 0.55, 1.40, 2.55);
    boks(T + 0.02, F + 0.40, 2.40, 0.40, F + 0.85, 2.55, M.mørkGrå);  // puter mot kommoden
    boks(1.45, F, 0.28, 1.90, F + 0.50, 0.68, M.hvit);                // nattbord
    boks(1.05, F + 0.12, 0.20, 2.65, F + 0.42, 0.27, M.hvit);         // radiator
    for (const z of [1.30, 1.75]) boks(2.825, F + 1.25, z, 2.85, F + 1.85, z + 0.35, M.svart);

    // soverom 7 m² (mot hagen, lyseblått): seng under vinduet fra vegg til vegg, svart nattbord,
    // hvitt garderobeskap ved døra og papirlampe i taket
    seng(2.96, 0.22, B - T - 0.02, 1.40, M.svart);                   // over hele rommets bredde
    boks(4.60, F, 1.45, 5.02, F + 0.55, 1.85, M.svart);               // nattbord på innsiden av senga
    garderobe(4.05, 2.60, B - T, 3.20);
    for (const z of [0.55, 0.95]) boks(2.944, F + 1.30, z, 2.965, F + 1.80, z + 0.32, M.svart);
    {
      const papirlampe = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 12), M.hvit);
      papirlampe.position.set(4.0, F + 2.05, 1.70); mål.add(papirlampe);
      boks(3.995, F + 2.25, 1.695, 4.005, F + H, 1.705, M.hvit);
    }

    // bad 7,5 m²: dusjhjørne med glassdører, vegghengt dobbel servant mellom to høyskap,
    // speil med lysrør, WC på flislagt innkassing, vaskesøyle med runde åpninger
    boks(T, F, 4.64, 0.95, F + 0.01, 5.45, M.flis);                   // lys mosaikk i dusjen
    boks(0.93, F, 4.64, 0.95, F + 1.95, 5.45, M.glass);
    boks(T, F, 5.43, 0.95, F + 1.95, 5.45, M.glass);
    boks(T, F, 5.75, T + 0.01, F + H, 6.05, M.flisStripe);            // stripe i brun flis
    boks(T + 0.01, F + 1.15, 5.80, T + 0.04, F + 1.17, 6.00, M.stål);   // håndklestang
    boks(0.62, F + 0.45, 6.70, 1.78, F + 0.88, 7.18, M.hvit);         // servant med skuffer
    boks(0.62, F + 0.88, 6.66, 1.78, F + 0.92, 7.18, M.hvit);
    boks(0.66, F + 1.10, 7.17, 1.74, F + 1.85, 7.18, M.speil);
    boks(0.70, F + 1.90, 7.08, 1.66, F + 1.95, 7.18, M.stål);         // lysrør over speilet
    for (const x1 of [T + 0.03, 1.78]) boks(x1, F + 0.30, 6.80, x1 + 0.37, F + 2.10, 7.18, M.hvit);
    boks(2.60, F, 6.10, 2.85, F + H, 6.75, M.flisStripe);             // innkassing for WC
    boks(2.18, F + 0.25, 6.24, 2.60, F + 0.42, 6.61, M.hvit);         // WC
    boks(2.595, F + 1.00, 6.32, 2.60, F + 1.15, 6.53, M.stål);        // skylleplate
    for (const [lx, lz] of [[1.98, 4.66], [2.80, 4.66], [1.98, 5.03], [2.80, 5.03]]) boks(lx, F, lz, lx + 0.04, F + 0.15, lz + 0.04, M.stål);
    boks(1.98, F + 0.15, 4.64, 2.85, F + 1.90, 5.09, M.hvit);         // vaskesøyle
    for (const [x, y] of [[2.20, 1.00], [2.62, 1.00], [2.20, 1.50], [2.62, 1.50]]) {
      const luke = new THREE.Mesh(new THREE.CircleGeometry(0.11, 24), M.mørkGrå);
      luke.position.set(x, F + y, 5.10); etg2.add(luke);
    }

    // soverom 12 m² (mot gata): innebygd garderobe med skyvedører i eik mellom sjakta og
    // fasaden, dobbeltseng mot veggen, TV på stativ, brune gardiner
    boks(4.47, F, 7.85, B - T, F + 2.35, 9.45, M.finer);
    boks(4.465, F + 0.02, 8.645, 4.47, F + 2.30, 8.655, M.stål);     // skinne mellom dørene
    boks(4.47, F + 2.35, 7.85, B - T, F + H, 9.45, standardVegg);
    seng(T + 0.02, 7.85, 2.20, 9.25, M.sengetøy);
    boks(T + 0.02, F, 7.38, 0.62, F + 0.45, 7.78, M.finer);           // nattbord
    boks(1.05, F + 0.12, 9.58, 3.10, F + 0.42, 9.65, M.hvit);         // radiator
    boks(2.60, F + 0.65, 7.55, 2.64, F + 1.40, 8.80, M.svart);        // TV på stativ
    boks(2.70, F, 8.15, 2.74, F + 0.65, 8.20, M.svart);
    boks(0.60, F + 2.30, 9.56, 4.30, F + 2.32, 9.58, M.stål);         // gardinstang
    for (const [x1, x2] of [[0.70, 0.99], [3.20, 3.75]]) boks(x1, F + 0.05, 9.50, x2, F + 2.30, 9.58, M.gardinBrun);

    // altan 4 m² over inngangsterrassen
    boks(2.80, H + 0.1, D, B, F - 0.02, 11.70, M.terrasse);
    spilevegg('x', 11.62, 11.70, 2.80, B, F - 0.02, 1.0);
    spilevegg('z', 2.80, 2.88, D, 11.62, F - 0.02, 1.0);
    spilevegg('z', B - 0.08, B, D, 11.62, F - 0.02, 1.0);
    boks(2.78, F + 1.0, 11.56, B, F + 1.06, 11.72, M.terrasse);
    boks(2.78, F + 1.0, D, 2.94, F + 1.06, 11.72, M.terrasse);
    boks(B - 0.14, F + 1.0, D, B, F + 1.06, 11.72, M.terrasse);
    for (const x of [3.1, 4.0]) {
      boks(x, F + 0.42, 10.95, x + 0.5, F + 0.47, 11.45, M.mørkGrå);
      boks(x, F + 0.47, 11.40, x + 0.5, F + 0.90, 11.45, M.mørkGrå);
    }
    boks(3.65, F + 0.30, 10.50, 4.05, F + 0.55, 10.90, M.mørkGrå);

    // himling over 2. etasje (av/på når 3. etasje er skjult)
    const himling2 = new THREE.Group();
    for (const [x1, x2, z1, z2] of dekke) boks(x1, F + H, z1, x2, 2 * F, z2, M.tak, himling2);
    etg2.add(himling2);

    mål = scene;

    // =====================================================================
    // ---------- 3. etasje (gulv på y = 2F), trukket inn bak takterrassen ----------
    // =====================================================================
    const etg3 = new THREE.Group();
    scene.add(etg3);
    mål = etg3;
    const G = 2 * F;                                                  // gulvnivå
    const Z3 = 3.15;                                                  // fasaden mot takterrassen

    for (const [x1, x2, z1, z2] of dekke) {
      boks(x1, F + H, z1, x2, G - 0.01, z2, M.tak);
      if (z2 > Z3) boks(x1, G - 0.01, Math.max(z1, Z3), x2, G, z2, M.eik);
    }
    boks(2.95, G, 7.36, B - T, G + 0.005, D - T, M.mørkFlis);         // vaskerom
    boks(0, F + H, -0.01, B, G, 0.1, M.kledning);                    // kledning over dekkekanten
    boks(0, F + H, D - 0.1, B, G, D + 0.01, M.kledning);
    boks(-0.01, F + H, 0, 0.1, G, D, M.kledning);
    boks(B - 0.1, F + H, 0, B + 0.01, G, D, M.kledning);

    // takterrasse 17 m²: brystning mot hagen og tette, skrå sidevegger i stående panel
    boks(0, G - 0.005, 0.1, B, G, Z3, M.spiler);
    for (let x = 0.05; x < B; x += 0.15) boks(x, G, 0.1, Math.min(x + 0.12, B), G + 0.03, Z3, M.terrasse);
    boks(0, G, 0, B, G + 1.0, 0.1, M.kledning);
    boks(-0.02, G + 1.0, -0.02, B + 0.02, G + 1.05, 0.14, M.porteTak);
    const takSide = [[0.1, 1.05], [0.6, 1.05], [2.6, 2.0], [Z3, 2.0]];
    for (const xMaks of [0.08, B]) {                                  // omriss som [z, y], tykkelse 0.08 mot -x
      const form = new THREE.Shape([[0.1, 0], ...takSide, [Z3, 0]].map(([z, y]) => new THREE.Vector2(z, y)));
      const side = new THREE.Mesh(new THREE.ExtrudeGeometry(form, { depth: 0.08, bevelEnabled: false }), M.spiler);
      side.rotation.y = -Math.PI / 2;                                 // formas x → +z, ekstrudering → -x
      side.position.set(xMaks, G, 0);
      side.castShadow = side.receiveShadow = true;
      mål.add(side);
    }
    // svart metall-hjørnesofa i hjørnet mot stuevinduet, bord, høye plantekrukker,
    // oppbevaringskasse mot brystningen og grå rottingsofa ved den andre sideveggen
    const ramme3 = (x1, z1, x2, z2, y1, y2) => {                       // åpen ramme av svarte profiler
      const t = 0.04;
      for (const [lx, lz] of [[x1, z1], [x2 - t, z1], [x1, z2 - t], [x2 - t, z2 - t]]) boks(lx, y1, lz, lx + t, y2, lz + t, M.svart);
      boks(x1, y2 - t, z1, x2, y2, z1 + t, M.svart); boks(x1, y2 - t, z2 - t, x2, y2, z2, M.svart);
      boks(x1, y2 - t, z1, x1 + t, y2, z2, M.svart); boks(x2 - t, y2 - t, z1, x2, y2, z2, M.svart);
    };
    for (const [z1, z2] of [[0.85, 1.55], [1.55, 2.25]]) {               // langs sideveggen
      ramme3(0.10, z1, 0.80, z2, G, G + 0.40);
      boks(0.10, G + 0.40, z1, 0.16, G + 0.75, z2, M.svart);
    }
    for (const [x1, x2] of [[0.10, 0.80], [0.80, 1.50], [1.50, 2.20]]) {  // langs stuevinduet
      ramme3(x1, 2.25, x2, 2.95, G, G + 0.40);
      boks(x1, G + 0.40, 2.89, x2, G + 0.75, 2.95, M.svart);
    }
    boks(0.10, G + 0.40, 2.25, 0.16, G + 0.75, 2.89, M.svart);        // rygg i hjørnemodulen
    ramme3(0.95, 1.30, 1.60, 1.95, G, G + 0.38);
    boks(0.95, G + 0.36, 1.30, 1.60, G + 0.38, 1.95, M.svart);
    for (const [x, z, h] of [[0.15, 0.20, 0.85], [0.55, 0.20, 0.55]]) boks(x, G, z, x + 0.35, G + h, z + 0.35, M.flett);
    boks(1.60, G, 0.12, 3.10, G + 0.60, 0.72, M.mørkGrå);            // oppbevaringskasse
    boks(4.40, G, 1.00, B - 0.10, G + 0.42, 2.90, M.flett);            // rottingsofa
    boks(B - 0.30, G + 0.42, 1.00, B - 0.10, G + 0.78, 2.90, M.flett);
    for (const z of [1.00, 2.75]) boks(4.40, G + 0.42, z, B - 0.30, G + 0.62, z + 0.15, M.flett);
    boks(3.65, G, 1.65, 4.20, G + 0.35, 2.25, M.flett);                // rottingbord

    // yttervegger, hvite vindusrammer og karmer som i resten av huset
    const terrasse3 = [
      { fra: 0.25, til: 2.54, nede: 0.30, oppe: 2.30, type: 'vindu', poster: [0.80], ramme: M.hvitRamme },
      { fra: 2.96, til: 3.73, nede: 0.00, oppe: 2.30, type: 'glassdør', ramme: M.hvitRamme },
      { fra: 4.34, til: 4.96, nede: 0.90, oppe: 2.20, type: 'vindu', ramme: M.hvitRamme },
    ];
    standardVegg = M.vegg3;
    vegg('x', Z3, Z3 + 0.1, 0, B, terrasse3, M.kledning, G);
    vegg('x', Z3 + 0.1, Z3 + T, T, B - T, terrasse3.map(o => ({ ...o, type: 'karm' })), standardVegg, G);
    const front3 = [
      { fra: 0.70, til: 2.58, nede: 0.90, oppe: 2.20, type: 'vindu', poster: [1.30], ramme: M.hvitRamme },
      { fra: 2.97, til: 3.95, nede: 0.90, oppe: 2.20, type: 'vindu', ramme: M.hvitRamme },
    ];
    vegg('x', D - 0.1, D, 0, B, front3, M.kledning, G);
    vegg('x', D - T, D - 0.1, T, B - T, front3.map(o => ({ ...o, type: 'karm' })), standardVegg, G);
    vegg('z', 0, 0.1, Z3, D, [], M.kledning, G);
    vegg('z', 0.1, T, Z3 + T, D - T, [], standardVegg, G);
    vegg('z', B - 0.1, B, Z3, D, [], M.kledning, G);
    vegg('z', B - T, B - 0.1, Z3 + T, D - T, [], standardVegg, G);

    // innervegger, bod over trappa og sjakter
    vegg('z', 4.02, TX1, Z3 + T, 6.60, [                              // stue | bod og trapperom
      { fra: 3.60, til: 4.30, nede: 0, oppe: 2.05, type: 'dør', farge: M.hvitDør },
    ], standardVegg, G);
    boks(TX1, G + 0.45, Z3 + T, TX2, G + 0.60, 4.86, M.eik);          // bod med hevet gulv over trappa
    boks(TX1, G + 0.45, 4.86, TX2, G + H, 4.98, standardVegg);        // bod | trapperom
    vegg('x', 6.90, 7.00, T, 2.17, [dør(0.80, 1.50)], standardVegg, G); // stue | soverom
    boks(2.17, G, 6.90, 2.93, G + H, 7.38, standardVegg);             // sjakt
    vegg('z', 2.85, 2.95, 7.38, D - T, [], standardVegg, G);          // soverom | vaskerom
    vegg('x', 7.27, 7.36, 2.93, 4.03, [dør(3.08, 3.77)], standardVegg, G); // stue | vaskerom
    boks(4.03, G, 7.27, B - T, G + H, 8.04, standardVegg);            // sjakt
    boks(0.80, G, 7.00, 0.84, G + 2.03, 7.62, M.hvitDør);             // dørblad soverom, inn mot skapet
    boks(3.73, G, 7.36, 3.77, G + 2.03, 8.05, M.hvitDør);             // dørblad vaskerom

    // stue 15,5 m²: lysegrå sofa med sjeselong under vinduet, digitalpiano med krakk mot
    // venstre vegg, teppe og to små svarte bord, TV på benk ved døra til soverommet
    // rett, lav og dyp sofa langs vinduet (ingen sjeselong): tykke ryggputer over de tre
    // setene mot pianoveggen, åpen ende uten ryggputer mot glassdøra, lavt armlene til venstre
    boks(0.65, G + 0.15, 3.40, 2.90, G + 0.42, 4.40, M.lysGrå);       // sete
    boks(0.65, G + 0.42, 3.40, 2.90, G + 0.60, 3.55, M.lysGrå);       // lav ryggramme
    for (const [x1, x2] of [[0.75, 1.20], [1.20, 1.65], [1.65, 2.10]]) // ryggputer
      boks(x1 + 0.01, G + 0.42, 3.55, x2 - 0.01, G + 0.85, 3.80, M.lysGrå);
    boks(0.65, G + 0.42, 3.55, 0.75, G + 0.55, 4.40, M.lysGrå);       // armlene
    for (const [x, z] of [[0.70, 3.45], [2.83, 3.45], [0.70, 4.33], [2.83, 4.33]]) boks(x, G, z, x + 0.04, G + 0.15, z + 0.04, M.stål);
    boks(0.90, G, 4.20, 2.60, G + 0.015, 5.90, M.ryeTeppe);
    for (const [x1, z1, h] of [[1.25, 4.50, 0.50], [1.50, 4.80, 0.43]]) ramme3(x1, z1, x1 + 0.42, z1 + 0.42, G, G + h);
    boks(1.25, G + 0.48, 4.50, 1.67, G + 0.50, 4.92, M.svart);
    boks(T, G, 5.20, 0.55, G + 0.78, 6.60, M.svart);                  // digitalpiano, lenger inn i rommet
    boks(T, G + 0.78, 5.20, 0.35, G + 1.05, 6.60, M.svart);
    boks(0.70, G, 5.60, 1.05, G + 0.50, 6.20, M.svart);               // pianokrakk
    boks(T, G + 1.35, 5.65, T + 0.025, G + 2.05, 6.15, M.svart);      // bilde over pianoet
    boks(T + 0.025, G + 1.38, 5.68, T + 0.03, G + 2.02, 6.12, M.hvit);
    boks(1.70, G, 6.45, 2.85, G + 0.45, 6.89, M.lysEik);              // TV-benk
    boks(1.85, G + 0.47, 6.60, 2.75, G + 1.10, 6.64, M.svart);        // TV på fot

    // soverom 8 m², brukt som kontor: buet skrivebord i eik langs veggen mot vaskerommet,
    // grå kontorstol, skjermer, teppe, mørkt garderobeskap ved døra og radiator under vinduet
    boks(2.05, G + 0.70, 7.70, 2.85, G + 0.74, 9.45, M.lysEik);
    for (const z of [7.80, 9.30]) boks(2.40, G, z, 2.48, G + 0.70, z + 0.08, M.mørkGrå);
    boks(2.55, G + 0.74, 8.30, 2.60, G + 1.20, 9.10, M.svart);         // buet skjerm
    boks(2.30, G + 0.74, 9.25, 2.35, G + 1.30, 9.55, M.svart);         // stående skjerm
    for (const z of [7.75, 9.35]) boks(2.55, G + 0.74, z, 2.80, G + 1.05, z + 0.25, M.svart);  // høyttalere
    boks(1.35, G + 0.42, 8.30, 1.85, G + 0.50, 8.80, M.mørkGrå);       // kontorstol
    boks(1.35, G + 0.50, 8.25, 1.85, G + 1.05, 8.32, M.mørkGrå);
    boks(1.55, G, 8.50, 1.65, G + 0.42, 8.60, M.mørkGrå);
    boks(0.85, G, 7.75, 2.00, G + 0.01, 9.30, M.ryeTeppe);
    boks(2.83, G + 1.25, 7.95, 2.85, G + 2.25, 8.95, M.svart);         // stort bilde over pulten
    boks(T, G, 7.00, 0.78, G + 2.00, 7.60, M.mørkBrun);               // garderobeskap
    boks(0.75, G + 0.12, 9.58, 2.55, G + 0.62, 9.65, M.hvit);          // radiator
    for (const z of [8.30, 8.55, 8.80]) boks(T + 0.05, G, z, T + 0.35, G + 1.00, z + 0.06, M.mørkBrun); // gitarer

    // vaskerom 4,5 m²: hvite fliser, mørk mosaikk på gulvet, vaskemaskin og tørketrommel
    // under overskap, utslagsvask med skap ved vinduet, WC
    const L3 = 0.004;
    const flis3 = (akse, a, b, fra, til, åpninger) =>
      vegg(akse, a, b, fra, til, åpninger.map(o => ({ ...o, type: 'åpning' })), M.hvitFlis, G);
    flis3('z', 2.95, 2.95 + L3, 7.36, D - T, []);
    flis3('z', B - T - L3, B - T, 8.04, D - T, []);
    flis3('x', D - T - L3, D - T, 2.95, B - T, [front3[1]]);
    flis3('x', 7.36, 7.36 + L3, 2.95, 4.03, [dør(3.08, 3.77)]);
    flis3('z', 4.03 - L3, 4.03, 7.36, 8.04, []);
    flis3('x', 8.04, 8.04 + L3, 4.03, B - T, []);
    boks(2.95, G + 0.60, 8.25, 3.45, G + 0.90, 8.75, M.stål);
    boks(2.95, G, 8.90, 3.50, G + 0.90, D - T, M.hvit);
    boks(4.90, G, 8.10, B - T, G + 0.80, 8.60, M.hvit);
    boks(4.45, G + 0.20, 8.15, 4.90, G + 0.42, 8.55, M.hvit);
    boks(3.96, G, 9.05, 4.53, G + 0.85, D - T, M.hvit);                // vaskemaskin
    boks(4.53, G, 9.05, B - T, G + 0.85, D - T, M.hvit);               // tørketrommel
    for (const x of [4.245, 4.80]) {
      const luke = new THREE.Mesh(new THREE.CircleGeometry(0.17, 24), M.mørkGrå);
      luke.position.set(x, G + 0.45, 9.04); luke.rotation.y = Math.PI; etg3.add(luke);
    }
    boks(3.97, G + 1.55, 9.30, 5.00, G + 2.15, D - T, M.skap);

    // flatt tak (av/på)
    const tak3 = new THREE.Group();
    boks(-0.05, G + H, Z3 - 0.05, B + 0.05, G + H + 0.25, D + 0.05, M.tak, tak3);
    etg3.add(tak3);

    mål = scene;

    // ---------- Romnavn ----------
    etikett('Terrasse', '25 m²', 2.6, -2.6, 1.3, 'ute');
    etikett('Stue', '35 m²', 2.6, 3.0);
    etikett('Kjøkken', '8 m²', 1.5, 8.0);
    etikett('Entré', '4,5 m²', 3.7, 8.6);
    etikett('Tek. rom', '2 m²', 4.6, 6.3);
    etikett('Terrasse', '4 m²', 4.1, 10.8, 1.0);
    etikett('Bod', '5 m²', 4.0, 13.1, 1.3, 'ute');
    etikett('Soverom', '13 m²', 1.6, 2.3, F + 1.3, 'etg2');
    etikett('Soverom', '7 m²', 4.0, 1.8, F + 1.3, 'etg2');
    etikett('Gang m/trapp', '8,5 m²', 3.45, 5.2, F + 1.3, 'etg2');
    etikett('Bad', '7,5 m²', 1.4, 5.9, F + 1.3, 'etg2');
    etikett('Soverom', '12 m²', 2.6, 8.5, F + 1.3, 'etg2');
    etikett('Altan', '4 m²', 4.0, 10.8, F + 1.3, 'etg2');
    etikett('Takterrasse', '17 m²', 2.6, 1.6, 2 * F + 1.3, 'etg3');
    etikett('Stue', '15,5 m²', 2.4, 5.3, 2 * F + 1.3, 'etg3');
    etikett('Bod', '1 m²', 4.6, 4.0, 2 * F + 1.8, 'etg3');
    etikett('Soverom', '8 m²', 1.2, 8.3, 2 * F + 1.3, 'etg3');
    etikett('Vaskerom', '4,5 m²', 3.6, 8.5, 2 * F + 1.3, 'etg3');

    // ---------- Visninger ----------
    const vis = { etasje: 3, lave: false, tak: false, etiketter: true };
    const fokus = () => midt.clone().setY((vis.etasje - 1) * F);

    function oppdater() {
      etg2.visible = vis.etasje >= 2;
      etg3.visible = vis.etasje === 3;
      tak.visible = vis.tak && vis.etasje === 1;
      himling2.visible = vis.tak && vis.etasje === 2;
      tak3.visible = vis.tak;
      takUte.forEach(o => { o.visible = vis.tak || vis.etasje >= 2; });
      // Bokser kortes ned i stedet for å klippes, så de forblir lukkede og ikke flimrer.
      // Klippeplanet brukes bare for de få formene som ikke er bokser (trappesider o.l.).
      const kuttHøyde = vis.lave ? (vis.etasje - 1) * F + 1.1 : Infinity;
      kutt.constant = vis.lave ? kuttHøyde + 0.002 : 100;
      for (const { mesh, y1, y2 } of veggbokser) {
        const topp = Math.min(y2, kuttHøyde);
        mesh.visible = topp > y1;
        mesh.scale.y = mesh.visible ? (topp - y1) / (y2 - y1) : 1;
        mesh.position.y = mesh.visible ? (y1 + topp) / 2 : (y1 + y2) / 2;
      }
      for (const o of etiketter) {
        const g = o.userData.gruppe;
        o.visible = vis.etiketter && (g === 'ute' || g === `etg${vis.etasje}`);
      }
    }
    function sett3d() {
      camera.position.copy(fokus()).add(new THREE.Vector3(8.4, 13, -9.9));
      controls.target.copy(fokus());
      controls.update();
    }
    function settOvenfra() {
      camera.position.copy(fokus()).add(new THREE.Vector3(0, 24, 0.01));
      controls.target.copy(fokus());
      controls.update();
    }
    oppdater();
    sett3d();

    const knapp = id => document.getElementById(id);
    const velg = (på, av) => { knapp(på).classList.add('på'); knapp(av).classList.remove('på'); };
    let ovenfra = false;
    const settVisning = () => (ovenfra ? settOvenfra : sett3d)();
    knapp('vis3d').onclick = () => { ovenfra = false; sett3d(); velg('vis3d', 'ovenfra'); };
    knapp('ovenfra').onclick = () => { ovenfra = true; settOvenfra(); velg('ovenfra', 'vis3d'); };
    for (const n of [1, 2, 3]) {
      knapp(`etg${n}`).onclick = () => {
        vis.etasje = n;
        for (const m of [1, 2, 3]) knapp(`etg${m}`).classList.toggle('på', m === n);
        oppdater();
        settVisning();
      };
    }
    for (const id of ['lave', 'tak', 'etiketter']) {
      knapp(id).onclick = e => { vis[id] = e.currentTarget.classList.toggle('på'); oppdater(); };
    }

    // Videogjennomgang i en modal dialog: fokus holdes i dialogen, Esc lukker,
    // og nettleseren gir fokus tilbake til knappen etterpå.
    const videoLag = knapp('video'), filmen = knapp('filmen');
    const valg = [...document.querySelectorAll('#videovalg button')];
    const velgFilm = navn => {
      valg.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.film === navn)));
      filmen.poster = `video/${navn}.jpg`;
      filmen.src = `video/${navn}.mp4`;
    };
    valg.forEach(b => { b.onclick = () => { velgFilm(b.dataset.film); filmen.play().catch(() => {}); }; });
    velgFilm('omvisning');
    knapp('videoknapp').onclick = () => { videoLag.showModal(); filmen.play().catch(() => {}); };
    knapp('lukkVideo').onclick = () => videoLag.close();
    videoLag.onclick = e => { if (e.target === videoLag) videoLag.close(); };   // klikk utenfor videoen
    videoLag.addEventListener('close', () => filmen.pause());

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      etikettRenderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
      etikettRenderer.render(scene, camera);
    });

    // Brukes av opptaksskriptet for videoen (styrer kamera og visning bilde for bilde).
    window.huldervegen = { THREE, scene, camera, renderer, controls, vis, oppdater, tak3, F };
  </script>
</body>
</html>
